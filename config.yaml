# Video Factory — global configuration.
# Per-project overrides live in projects/<slug>/project.yaml (same keys).

video:
  aspect_ratio: "9:16"        # "9:16" (Reels/Shorts) or "16:9" (in-stream)
  width: 1080
  height: 1920
  fps: 30
  target_seconds: 90
  # --- Editing (research-backed; verified vs the ffmpeg binary). ---
  crossfade:                  # gentle dissolves between scenes instead of hard
    duration: 0.4             #   cuts. Timeline-preserving xfade chain. false =
    transition: "fade"        #   hard cuts. xfade type: fade|fadeblack|dissolve|…
  # grade: false              # disable the colour grade (default: warm eq + warmth
  #   + subtle vignette; grain off). Or a dict: {eq, temperature, temp_mix,
  #   vignette, grain}. grain>0 opts into film grain (bitrate-heavy).
  # fade_in: 0.5              # picture fade from black on the open (seconds)
  # fade_out: 2.0             # picture fade to black (default = the music outro)
  speed: 1.0                  # playback speed of the finished cut (1.0 = natural).
                              #   A single uniform time-scale applied LAST, so every
                              #   overlay stays in sync and pitch is preserved
                              #   (atempo). e.g. 1.15 = 15% brisker. Per-project.

script:
  audience: "general Arab"
  dialect: "MSA"              # one register per video; enforced by the video-script skill

voice:
  provider: "elevenlabs"      # thin interface — swappable (see pipeline/voice.py)
  voice_id: ""                # REQUIRED: your ElevenLabs voice id
  model_id: "eleven_multilingual_v2"
  stability: 0.5
  similarity_boost: 0.75
  speed: 1.0
  diacritize: true            # auto-add Arabic tashkeel (CATT, Apache-2.0, CPU)
                              # before TTS so correctly-spelled words are
                              # PRONOUNCED correctly; display/captions keep the
                              # plain spelling, word count is preserved (timing
                              # safe). Silent fallback if CATT isn't installed.
                              # NOTE: ~doubles ElevenLabs char billing; free for
                              # chatterbox. Per-word fixes still go in
                              # pronunciation.json (they override CATT).
  ramble_guard: true          # if a diacritized scene makes the TTS over-generate
                              # (Chatterbox can loop on heavy tashkeel — 30s+ of
                              # audio for an 8s line), redo THAT scene with plain
                              # text so nothing rambles. Only active with diacritize.
  # --- Voice-content audit (hardening). After a real voice run the pipeline
  #     free-transcribes the voiceover (faster-whisper; transcribe.* below) and
  #     compares it to the script, catching TTS stutters — a word spoken twice,
  #     e.g. تجاهه/تجاه — that forced alignment silently maps onto the script,
  #     plus likely mispronunciations (advisory). For chatterbox a stutter is
  #     auto-healed (the scene is re-rolled, seed 0 = a fresh take) and the
  #     render rebuilt; for elevenlabs it is only flagged (a re-roll costs $$).
  #     Also runnable on demand: `python run.py audit-voice <project> [--fix]`.
  audit: true                 # false = skip the post-voice audit entirely
  auto_fix: true              # chatterbox only: re-roll + re-render on a stutter
  # usd_per_1k_chars: 0.30    # optional: your plan's rate — enables the $
                              # figure in `python run.py estimate <project>`
  # --- Self-hosted open TTS (fixed cost). To enable, set provider: "chatterbox"
  #     above. No ElevenLabs key/voice_id needed; word timing is recovered by
  #     WhisperX forced alignment. Requires the separate GPU venv —
  #     see docs/ai-video/SELF_HOSTED_TTS.md.
  chatterbox:
    # ai_python: 'D:\vd-ai\venv\Scripts\python.exe'  # GPU venv python (this
    #   machine's default; else set env VD_AI_PYTHON). build() falls back to it.
    # hf_home: 'D:\vd-ai\models'    # where model weights cache (this machine: D:)
    language: "ar"
    voice_ref: ""               # optional ~5s reference wav (cloning); "" = default voice
    exaggeration: 0.5
    cfg_weight: 0.5
    seed: 0                      # >0 = reproducible audio (keeps voice_cache stable)
    # voice_ref: 'assets/voice/narrator_ar.wav'  # ← biggest quality lever: an
    #   8-15s clean single-speaker Arabic narrator clip. Cloning it gives a
    #   warm, consistent narrator instead of the flat default voice. Leave ""
    #   until you have a reference you have rights to. See SELF_HOSTED_TTS.md.

  # --- Reliable self-hosted Arabic TTS (fixed cost). Set provider: "silma".
  #     SILMA (silma-ai/silma-tts, MIT/Apache, F5-diffusion) is purpose-built for
  #     Arabic: it diacritizes internally (CATT) and stays stable where Chatterbox
  #     loops. Runs in ITS OWN venv (D:\silma-tts\.venv) via scripts/silma_worker.py;
  #     word timing is recovered by the pipeline's faster-whisper (transcribe.*).
  #     Our diacritize/ramble_guard are skipped for silma (it handles tashkeel).
  silma:
    # silma_python: 'D:\silma-tts\.venv\Scripts\python.exe'  # its venv (default;
    #   else set env VD_SILMA_PYTHON). build() falls back to it.
    # hf_home: 'D:\vd-ai\models'    # model weights cache (silma-ai/silma-tts, ~600MB)
    ref_file: ""                # "" = SILMA's bundled Arabic reference voice.
                                #   Point at an 8-15s clean single-speaker clip to
                                #   clone a chosen narrator (also set ref_text).
    ref_text: ""                # transcript of ref_file (required if ref_file set)
    seed: 0                     # >0 = reproducible audio (keeps voice_cache stable)
    nfe_step: 16                # diffusion steps (quality/speed; 16 is the default)
    cfg_strength: 2.0           # guidance
    speed: 1.0
    force_tashkeel: false       # false (recommended): WE add tashkeel (CATT) and
                                #   apply pronunciation.json overrides, so wrong
                                #   vowels/names are correctable. true: SILMA adds
                                #   them itself (overrides won't apply).

  # Per-scene expressive delivery + designed pauses. Maps each scene's `mood`
  # to Chatterbox emotion params and the breath AFTER the scene, so the read
  # follows the emotional arc instead of a flat monotone. KEY RULE (research):
  # get intensity from LOWER cfg_weight, not high exaggeration — high
  # exaggeration speeds Arabic up, wrong for heavy beats. Applied only for the
  # chatterbox provider; ElevenLabs ignores the per-scene emotion (pauses still
  # apply). Remove this whole block to fall back to one flat voice, no pauses.
  delivery:
    by_mood:                     # mood enum: energetic | archival | calm
      energetic: { exaggeration: 0.70, cfg_weight: 0.42, pause_after: 0.25 }
      archival:  { exaggeration: 0.38, cfg_weight: 0.60, pause_after: 0.45 }
      calm:      { exaggeration: 0.42, cfg_weight: 0.58, pause_after: 0.35 }
    default:     { exaggeration: 0.50, cfg_weight: 0.50, pause_after: 0.30 }
    # Audit vs the reference VO (2026-09-05): theirs breathes throughout (many
    # ~0.3s pauses, max gap ~0.7s); ours was blocky (few, but up to ~1.5s). Keep
    # inter-scene breaths short so the pacing stays tight, not draggy.
    mood_shift_pause: 0.45       # a breath at a real beat change
    max_pause: 0.85            # cap: their longest gap was ~0.72s

footage:
  providers: ["pexels", "pixabay"]   # tried in order
  min_height: 1080
  orientation: "portrait"            # derived from aspect_ratio if omitted
  used_clip_log: "assets/used_clips.json"
  ai_broll: false                    # true = generate B-roll locally via ComfyUI
                                     # (see broll below) instead of stock search;
                                     # output MUST be labeled AI-generated at publish.
  broll:                             # generated-B-roll settings (only used when ai_broll: true)
    engine: "video"                  # "video" = LTX photoreal clips; "image" = SDXL storybook illustration + Ken Burns
    comfy_url: "http://127.0.0.1:8188"     # headless ComfyUI REST API
    # Default = 8-step DISTILLED 2B: warm ~25-45s/clip on 8GB (scales with the
    # per-scene clip length), far faster than the 20-step base (~112s), equal-
    # or-better quality. Base instead: checkpoint "ltx-video-2b-v0.9.5.safetensors"
    # + steps: 20, cfg: 3.0.
    checkpoint: "ltxv-2b-0.9.6-distilled-04-25.safetensors"
    t5: "t5xxl_fp8_e4m3fn.safetensors"
    width: 768
    height: 512
    length: 97                       # FALLBACK frames (8*k+1) when a scene's
                                     # duration is unknown; normally each clip's
                                     # length is matched to its scene (see max_seconds)
    fps: 25
    steps: 8                         # distilled: 8 is the sweet spot (more won't help)
    cfg: 1.0                         # distilled bakes in guidance -> cfg 1.0 (no CFG)
    sampler: "euler"
    max_seconds: 8.0                 # cap per-scene clip length (generation speed + 8GB VRAM)
    # --- engine "image": SDXL + storybook LoRA still -> ffmpeg Ken Burns pan.
    #     Generates one hand-drawn watercolor illustration per scene (fixed-cost).
    image:
      checkpoint: "sd_xl_base_1.0.safetensors"
      lora: "StoryBookRedmond-KidsRedmAF.safetensors"  # warm soft hand-drawn storybook
      lora_strength: 0.85            # (trigger "KidsRedmAF" — see broll_image.LORA_TRIGGER)
      vae: "sdxl_vae.safetensors"    # fp16-fix VAE (avoids black frames)
      width: 768                     # SDXL 9:16 latent bucket
      height: 1344
      steps: 26
      cfg: 6.0                       # flat color bands/oversaturates at higher cfg
      sampler: "dpmpp_2m"
      scheduler: "karras"
    # See docs/ai-video/GENERATED_BROLL.md for setup + the speed/quality knobs.

captions:
  font: "Tajawal"
  font_size: 70                      # bold, large kinetic captions
  primary_color: "&H00FFFFFF"        # ASS BGR hex — white fill
  highlight_color: "&H0000D7FF"      # karaoke highlight — amber (karaoke style only)
  outline_color: "&H00000000"        # black stroke
  outline: 4                         # thick stroke (the bold-caption look)
  margin_v: 480                      # lower-third, ABOVE the ~510px bottom UI risk
                                     # zone (TikTok/Reels/Shorts 2026 caption+CTA
                                     # bar); was 300 = clipped by platform UI
  karaoke: true                      # fallback selector when `style` is unset
  # --- kinetic caption style (reverse-engineered from The Novel Gist) ---
  style: "reveal"                    # "reveal" = words type on one at a time with a
                                     #   grey->white pop on the newest (the kinetic
                                     #   look); "karaoke" = full line, active word
                                     #   highlighted; "static" = plain page.
  align: "center"                    # "center" (kinetic) or "right" (classic RTL)
  max_lines: 3                       # a reveal page builds up to this many lines
  pop_color: "&H00AAAAAA"            # newest word lands in this grey, then turns white
  pop_seconds: 0.12                  # how long that pop lasts

audio:
  music_dir: "assets/music"
  # Mix tuned for music-under-narration (research 2026): the bed sits ~16-24 dB
  # below the voice during speech — present texture, not a co-lead — via a GENTLE
  # sidechain (a hard ratio/low threshold acts as a noise gate and makes the bed
  # vanish, which read as "sound stops").
  music_gain_db: -11                 # bed level before ducking (compressor rides it)
  duck_threshold: 0.09               # ~-21 dBFS: reacts to speech, not room tone
  duck_ratio: 3.5                    # gentle ride-under (NOT a gate; was 8)
  duck_attack: 15                    # ms — catch word onsets
  duck_release: 400                  # ms — recover like breathing, no pumping
  duck_knee: 6                       # soft knee = smooth, not a mechanical snap
  loudness_lufs: -14                 # 2026 social target (was -16 = quiet in-feed)
  # Entrance swell + graceful outro (the reference channel's "entrance"). Needs a
  # track in music_dir — synthesize one with: python tools/make_music_bed.py
  entrance_seconds: 2.0              # how long the opening swell holds (0 = off)
  entrance_gain_db: 4                # softer, so the settle isn't heard as a drop
  entrance_ramp: 2.5                 # slow settle back to bed level
  intro_fade: 1.2                    # music rises from silence over this
  outro_fade: 2.0                    # music fades out at the end (no hard stop)
  # Transition SFX: a subtle page-turn at SECTION beats (the reference channel's
  # "chapter turning" feel). It is an extra mix input — not ducked — set false to
  # disable. Placement: an explicit per-project `scenes:` list of section-start
  # ids reads most intentional; otherwise it fires on a mood change, coalesced by
  # `min_gap` so oscillating moods don't put a turn on every cut.
  sfx:
    file: "assets/sfx/page.wav"       # 0.35s page-turn (synth); swap for a richer one
    gain_db: -16                      # subtle under the voice (was -11 = a touch loud)
    at: "sections"                    # "sections" (mood-shift, coalesced) | "every_scene"
    min_gap: 14                       # seconds — never two turns closer than this (auto)
    lead: 0.10                        # place the turn this many seconds before the cut
    # scenes: [3, 6, 9, 12, 14]       # explicit section starts (overrides `at`) — per-project

transcribe:
  model: "small"                     # faster-whisper model size
  device: "cpu"
  compute_type: "int8"

publish:
  auto_post: false                   # stays false until the format is proven
