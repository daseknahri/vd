# Video Factory — global configuration.
# Per-project overrides live in projects/<slug>/project.yaml (same keys).

video:
  aspect_ratio: "9:16"        # "9:16" (Reels/Shorts) or "16:9" (in-stream)
  width: 1080
  height: 1920
  fps: 30
  target_seconds: 90

script:
  audience: "general Arab"
  dialect: "MSA"              # one register per video; enforced by the video-script skill

voice:
  provider: "elevenlabs"      # thin interface — swappable (see pipeline/voice.py)
  voice_id: ""                # REQUIRED: your ElevenLabs voice id
  model_id: "eleven_multilingual_v2"
  stability: 0.5
  similarity_boost: 0.75
  speed: 1.0
  # usd_per_1k_chars: 0.30    # optional: your plan's rate — enables the $
                              # figure in `python run.py estimate <project>`
  # --- Self-hosted open TTS (fixed cost). To enable, set provider: "chatterbox"
  #     above. No ElevenLabs key/voice_id needed; word timing is recovered by
  #     WhisperX forced alignment. Requires the separate GPU venv —
  #     see docs/ai-video/SELF_HOSTED_TTS.md.
  chatterbox:
    # ai_python: 'D:\vd-ai\venv\Scripts\python.exe'  # GPU venv python (this
    #   machine's default; else set env VD_AI_PYTHON). build() falls back to it.
    # hf_home: 'D:\vd-ai\models'    # where model weights cache (this machine: D:)
    language: "ar"
    voice_ref: ""               # optional ~5s reference wav (cloning); "" = default voice
    exaggeration: 0.5
    cfg_weight: 0.5
    seed: 0                      # >0 = reproducible audio (keeps voice_cache stable)
    # voice_ref: 'assets/voice/narrator_ar.wav'  # ← biggest quality lever: an
    #   8-15s clean single-speaker Arabic narrator clip. Cloning it gives a
    #   warm, consistent narrator instead of the flat default voice. Leave ""
    #   until you have a reference you have rights to. See SELF_HOSTED_TTS.md.

  # Per-scene expressive delivery + designed pauses. Maps each scene's `mood`
  # to Chatterbox emotion params and the breath AFTER the scene, so the read
  # follows the emotional arc instead of a flat monotone. KEY RULE (research):
  # get intensity from LOWER cfg_weight, not high exaggeration — high
  # exaggeration speeds Arabic up, wrong for heavy beats. Applied only for the
  # chatterbox provider; ElevenLabs ignores the per-scene emotion (pauses still
  # apply). Remove this whole block to fall back to one flat voice, no pauses.
  delivery:
    by_mood:                     # mood enum: energetic | archival | calm
      energetic: { exaggeration: 0.70, cfg_weight: 0.42, pause_after: 0.30 }
      archival:  { exaggeration: 0.38, cfg_weight: 0.60, pause_after: 0.55 }
      calm:      { exaggeration: 0.42, cfg_weight: 0.58, pause_after: 0.40 }
    default:     { exaggeration: 0.50, cfg_weight: 0.50, pause_after: 0.40 }
    mood_shift_pause: 0.60       # a breath at a real beat change (short-form: keep tight)
    max_pause: 1.2              # never let a single pause read as dead air

footage:
  providers: ["pexels", "pixabay"]   # tried in order
  min_height: 1080
  orientation: "portrait"            # derived from aspect_ratio if omitted
  used_clip_log: "assets/used_clips.json"
  ai_broll: false                    # true = generate B-roll locally via ComfyUI
                                     # (see broll below) instead of stock search;
                                     # output MUST be labeled AI-generated at publish.
  broll:                             # generated-B-roll settings (only used when ai_broll: true)
    engine: "video"                  # "video" = LTX photoreal clips; "image" = SDXL storybook illustration + Ken Burns
    comfy_url: "http://127.0.0.1:8188"     # headless ComfyUI REST API
    # Default = 8-step DISTILLED 2B: warm ~25-45s/clip on 8GB (scales with the
    # per-scene clip length), far faster than the 20-step base (~112s), equal-
    # or-better quality. Base instead: checkpoint "ltx-video-2b-v0.9.5.safetensors"
    # + steps: 20, cfg: 3.0.
    checkpoint: "ltxv-2b-0.9.6-distilled-04-25.safetensors"
    t5: "t5xxl_fp8_e4m3fn.safetensors"
    width: 768
    height: 512
    length: 97                       # FALLBACK frames (8*k+1) when a scene's
                                     # duration is unknown; normally each clip's
                                     # length is matched to its scene (see max_seconds)
    fps: 25
    steps: 8                         # distilled: 8 is the sweet spot (more won't help)
    cfg: 1.0                         # distilled bakes in guidance -> cfg 1.0 (no CFG)
    sampler: "euler"
    max_seconds: 8.0                 # cap per-scene clip length (generation speed + 8GB VRAM)
    # --- engine "image": SDXL + storybook LoRA still -> ffmpeg Ken Burns pan.
    #     Generates one hand-drawn watercolor illustration per scene (fixed-cost).
    image:
      checkpoint: "sd_xl_base_1.0.safetensors"
      lora: "StoryBookRedmond-KidsRedmAF.safetensors"  # warm soft hand-drawn storybook
      lora_strength: 0.85            # (trigger "KidsRedmAF" — see broll_image.LORA_TRIGGER)
      vae: "sdxl_vae.safetensors"    # fp16-fix VAE (avoids black frames)
      width: 768                     # SDXL 9:16 latent bucket
      height: 1344
      steps: 26
      cfg: 6.0                       # flat color bands/oversaturates at higher cfg
      sampler: "dpmpp_2m"
      scheduler: "karras"
    # See docs/ai-video/GENERATED_BROLL.md for setup + the speed/quality knobs.

captions:
  font: "Tajawal"
  font_size: 70                      # bold, large kinetic captions
  primary_color: "&H00FFFFFF"        # ASS BGR hex — white fill
  highlight_color: "&H0000D7FF"      # karaoke highlight — amber (karaoke style only)
  outline_color: "&H00000000"        # black stroke
  outline: 4                         # thick stroke (the bold-caption look)
  margin_v: 300                      # lower-middle; clear of platform UI overlays
  karaoke: true                      # fallback selector when `style` is unset
  # --- kinetic caption style (reverse-engineered from The Novel Gist) ---
  style: "reveal"                    # "reveal" = words type on one at a time with a
                                     #   grey->white pop on the newest (the kinetic
                                     #   look); "karaoke" = full line, active word
                                     #   highlighted; "static" = plain page.
  align: "center"                    # "center" (kinetic) or "right" (classic RTL)
  max_lines: 3                       # a reveal page builds up to this many lines
  pop_color: "&H00AAAAAA"            # newest word lands in this grey, then turns white
  pop_seconds: 0.12                  # how long that pop lasts

audio:
  music_dir: "assets/music"
  music_gain_db: -14                 # bed level before ducking
  duck_threshold: 0.05               # sidechain compression settings
  duck_ratio: 8
  loudness_lufs: -16                 # EBU R128 target (per-platform spec)

transcribe:
  model: "small"                     # faster-whisper model size
  device: "cpu"
  compute_type: "int8"

publish:
  auto_post: false                   # stays false until the format is proven
